name: LX Music Sync Server
version: "2.1.4"
slug: lxserver
description: >-
  LX Music 数据同步服务端 + Web 音乐播放器（增强版）。
  同时兼容 LX Music 客户端同步、Subsonic 协议与网页播放，基于上游预构建镜像，无需本机编译。
url: https://github.com/XCQ0607/lxserver
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
stage: stable
backup: cold
panel_icon: mdi:music-note-eighth
panel_title: LX Music
webui: http://[HOST]:[PORT:9527]/
watchdog: tcp://[HOST]:[PORT:9527]
ports:
  9527/tcp: 9527
ports_description:
  9527/tcp: Web 播放器 / 管理后台 / 同步服务
map:
  - media:rw
  - share:rw
options:
  admin_password: "123456"
  server_name: lxserver
  player_name: LX Music Web
  enable_webplayer_auth: false
  webplayer_password: "123456"
  admin_path: /admin
  player_path: /
  enable_user_path: true
  enable_user_root: false
  users: []
  max_snapshot_num: 10
  list_add_music_location_type: top
  enable_custom_music_dir: false
  enable_cache_size_limit: false
  cache_size_limit: 2000
  config_backup_enable: true
  config_backup_retention_days: 7
  subsonic_enable: true
  subsonic_path: /rest
  subsonic_online_search: true
  subsonic_online_search_mode: fallback
  subsonic_online_search_sources: "wy,tx,kw,kg,mg"
  subsonic_quality_enabled: true
  subsonic_quality_priority: "flac,320k,128k"
  subsonic_cache_on_play: false
  subsonic_play_cache_first: false
  webdav_enable: false
  webdav_url: ""
  webdav_username: ""
  webdav_password: ""
  webdav_sync_path: /lx-sync
  webdav_backup_path: /lx-sync-backups
  sync_interval: 60
  backup_interval: 24
  webdav_exclude_cache: false
  webdav_exclude_music: false
  proxy_all_enabled: false
  proxy_all_address: ""
  proxy_header: ""
  disable_telemetry: false
  enable_debug: false
schema:
  admin_password: password
  server_name: str
  player_name: str
  enable_webplayer_auth: bool
  webplayer_password: password
  admin_path: str
  player_path: str
  enable_user_path: bool
  enable_user_root: bool
  users:
    - username: str
      password: password
  max_snapshot_num: int(1,100)
  list_add_music_location_type: list(top|bottom)
  enable_custom_music_dir: bool
  enable_cache_size_limit: bool
  cache_size_limit: int(100,1000000)
  config_backup_enable: bool
  config_backup_retention_days: int(1,365)
  subsonic_enable: bool
  subsonic_path: str
  subsonic_online_search: bool
  subsonic_online_search_mode: list(fallback|merge|local_only)
  subsonic_online_search_sources: str
  subsonic_quality_enabled: bool
  subsonic_quality_priority: str
  subsonic_cache_on_play: bool
  subsonic_play_cache_first: bool
  webdav_enable: bool
  webdav_url: str?
  webdav_username: str?
  webdav_password: password?
  webdav_sync_path: str
  webdav_backup_path: str
  sync_interval: int(1,1440)
  backup_interval: int(1,168)
  webdav_exclude_cache: bool
  webdav_exclude_music: bool
  proxy_all_enabled: bool
  proxy_all_address: str?
  proxy_header: str?
  disable_telemetry: bool
  enable_debug: bool
