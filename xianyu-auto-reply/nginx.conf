user  root;
worker_processes  1;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 低配主机：关闭访问日志，减少每条请求的写盘与 HA 日志转发开销
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level   6;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 9000 default_server;
        server_name _;

        root  /app/frontend-dist;
        index index.html;

        location /assets {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /frontend-health {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"success":true,"code":200,"message":"前端服务已启动","data":{"status":"running"}}';
        }

        location ^~ /api/v1/public/ {
            proxy_pass http://127.0.0.1:8089$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors on;
            error_page 500 502 503 504 =200 @public_status_unavailable;
        }

        location @public_status_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"success":false,"code":50303,"message":"状态查询服务暂不可用，请稍后重试","data":null}';
        }

        location /api {
            client_max_body_size 50m;
            proxy_pass http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 75s;
        }

        location /health {
            proxy_pass http://127.0.0.1:8089/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static {
            proxy_pass http://127.0.0.1:8089/static;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # index.html 必须不缓存：否则卸载/升级后浏览器仍从本地缓存渲染旧界面，
        # 表现为"服务已删除但页面还能打开、只是登录失败"。
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

    }
}
