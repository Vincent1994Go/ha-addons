[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------------- MySQL ----------------
[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/data/xianyu/mysql --socket=/run/mysqld/mysqld.sock --pid-file=/run/mysqld/mysqld.pid --bind-address=127.0.0.1 --port=3306 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=4000 --max-connect-errors=100000 --max-allowed-packet=256M --default-time-zone=+08:00 --skip-name-resolve
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=100
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------- Redis ----------------
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis-addon.conf
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------- 后端 API ----------------
[program:backend-web]
command=python /app/backend-web/main.py
directory=/app
priority=100
autostart=true
autorestart=true
startsecs=20
startretries=100
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------- WebSocket 服务 ----------------
[program:websocket]
command=python /app/websocket/main.py
directory=/app
priority=110
autostart=true
autorestart=true
startsecs=15
startretries=100
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------- 定时任务 ----------------
[program:scheduler]
command=python /app/scheduler/main.py
directory=/app
priority=120
autostart=true
autorestart=true
startsecs=15
startretries=100
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------- Nginx 前端 ----------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=200
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
